[pytest]
pythonpath = .
# pytest'овский faulthandler ловит низкоуровневые Windows SEH-сигналы из
# COM-вызовов (win32com/Word) и печатает пугающий "Windows fatal exception",
# даже когда сам тест прошёл нормально (см. test_corrupt_legacy_doc_is_skipped_not_crashed) —
# это шум, не реальный краш, отключаем ради читаемого вывода.
addopts = -p no:faulthandler
