name: Эксперимент самообновления (временный)

on:
  push:
    branches: ["claude/**"]

jobs:
  frozen-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Установка зависимостей
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Версия PyInstaller
        run: python -m PyInstaller --version
      - name: Сквозной тест настоящей программы
        working-directory: backend
        run: python -m pytest tests/test_self_update_frozen_e2e.py -v -s
